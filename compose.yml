name: idle-network-worker

services:
  honeygain:
    image: docker.io/honeygain/honeygain:latest
    container_name: honeygain
    restart: always
    labels:
      - io.containers.autoupdate=image
    command:
      - -email
      - "${HONEYGAIN_MAIL:?error}"
      - -pass
      - "${HONEYGAIN_PW:?error}"
      - -device
      - "${DEVICE_ID:-UNNAMED_DEVICE}"
      - -tou-accept

  pawns-cli:
    image: docker.io/iproyal/pawns-cli:latest
    container_name: pawns-cli
    restart: always
    labels:
      - io.containers.autoupdate=image
    command:
      - -email=${PAWNS-CLI_MAIL:?error}
      - -password=${PAWNS-CLI_PW:?error}
      - -device-name=${DEVICE_ID:-UNNAMED_DEVICE}
      - -device-id=${DEVICE_ID:-UNNAMED_DEVICE}
      - -accept-tos

  earnfm-client:
    image: docker.io/earnfm/earnfm-client:latest
    container_name: earnfm-client
    restart: always
    labels:
      - io.containers.autoupdate=image
    environment:
      EARNFM_TOKEN: "${EARNFM_TK:?error}"

  psclient:
    image: docker.io/packetstream/psclient:latest
    container_name: psclient
    restart: always
    labels:
      - io.containers.autoupdate=image
    environment:
      CID: "${PSCLIENT_TK:?error}"

  snowflake-proxy:
    image: docker.io/thetorproject/snowflake-proxy:nightly
    container_name: snowflake-proxy
    restart: always
    network_mode: host
    labels:
      - io.containers.autoupdate=image
    command:
      - -ephemeral-ports-range
      - "30000:60000"
      - -allow-non-tls-relay
      - -allow-proxying-to-private-addresses
      - -summary-interval
      - 3h
      - -metrics
      - -poll-interval
      - 2s

  cli_v2:
    image: docker.io/traffmonetizer/cli_v2:latest
    container_name: cli_v2
    restart: always
    labels:
      - io.containers.autoupdate=image
    environment:
      HOME: /var/lib/tm
    volumes:
      - tm-data:/var/lib/tm
    command:
      - --token
      - "${TRAFFMONETIZER_TOKEN:?error}"
      - --device-name
      - "${DEVICE_ID:-UNNAMED_DEVICE}"
      - start
      - accept

  myst:
    image: docker.io/mysteriumnetwork/myst:latest
    container_name: myst
    restart: always
    network_mode: host
    cap_add:
      - NET_ADMIN
    labels:
      - io.containers.autoupdate=image
    command:
      - service
      - --agreed-terms-and-conditions

volumes:
  tm-data:
    external: false
